<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcador de flecha de control (Azul sólido) -->
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <!-- Marcador de flecha de datos (Verde) -->
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Encabezado DO-178C -->
  <text x="570" y="38" fill="#f0f6fc" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">AHRS ATTITUDE ESTIMATOR — SOFTWARE ARCHITECTURE</text>
  <text x="570" y="58" fill="#8b949e" font-size="11" text-anchor="middle">DO-178C DAL B UNIDIRECTIONAL CONTROL &amp; DATA FLOW</text>

  <!-- ==================== 1. ENTRADA (INPUT) ==================== -->
  <g transform="translate(40, 90)">
    <rect width="210" height="390" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="105" y="32" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">INPUT</text>
    
    <!-- SensorModel Box -->
    <rect x="20" y="65" width="170" height="110" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="105" y="98" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">SensorModel</text>
    <line x1="35" y1="112" x2="175" y2="112" stroke="#30363d" stroke-width="1"/>
    <text x="105" y="134" fill="#7ee787" font-size="11" font-family="monospace" text-anchor="middle">ImuSample (100 Hz)</text>
    <text x="105" y="153" fill="#8b949e" font-size="10" text-anchor="middle">Synthetic Trajectory</text>

    <!-- Raw 6-DOF IMU Frame (Limpio y simplificado) -->
    <rect x="20" y="215" width="170" height="90" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="105" y="250" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="middle">Raw 6-DOF IMU</text>
    <line x1="35" y1="262" x2="175" y2="262" stroke="#21262d" stroke-width="1"/>
    <text x="105" y="284" fill="#8b949e" font-size="10" text-anchor="middle">Sensor Ingress Epochs</text>
  </g>

  <!-- ==================== 2. PROCESO (PROCESS) ==================== -->
  <g transform="translate(330, 90)">
    <rect width="480" height="390" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- TÍTULO PROCESS CENTRADO -->
    <text x="240" y="32" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">PROCESS</text>

    <!-- Caja 1: AttitudeEstimator -->
    <g transform="translate(50, 55)">
      <rect width="360" height="60" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="180" y="27" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">AttitudeEstimator</text>
      <text x="180" y="46" fill="#8b949e" font-size="10" text-anchor="middle">Public Facade | Ingress Monotonicity &amp; Status</text>
    </g>

    <!-- Caja 2: EKF_Core -->
    <g transform="translate(65, 160)">
      <rect width="330" height="65" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="165" y="28" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">EKF_Core</text>
      <text x="165" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Kalman Filter | Predict(ω, dt) &amp; Update(a)</text>
    </g>

    <!-- Caja 3: QuaternionMath (Borde azul unificado) -->
    <g transform="translate(65, 275)">
      <rect width="330" height="65" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="165" y="28" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">QuaternionMath</text>
      <text x="165" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Pure Math Functions | Stateless &amp; No-Heap</text>
    </g>

    <!-- Control 1: Facade -> EKF_Core -->
    <path d="M 230 115 L 230 160" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-ctrl)"/>

    <!-- Control 2: EKF_Core -> QuaternionMath -->
    <path d="M 230 225 L 230 275" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-ctrl)"/>

    <!-- BYPASS LATERAL: Facade -> QuaternionMath (Nace más abajo en Y=102, no choca) -->
    <path d="M 410 102 L 442 102 L 442 307 L 395 307" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)"/>
    
    <!-- Caja de etiqueta toEuler() agrandada y despegada -->
    <rect x="415" y="185" width="54" height="24" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="442" y="201" fill="#79c0ff" font-size="10" font-family="monospace" text-anchor="middle">toEuler</text>
  </g>

  <!-- ==================== 3. SALIDA (OUTPUT) ==================== -->
  <g transform="translate(890, 90)">
    <rect width="210" height="390" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="105" y="32" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">OUTPUT</text>

    <!-- Telemetry Out Box -->
    <rect x="20" y="65" width="170" height="145" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="105" y="98" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Telemetry Egress</text>
    <line x1="35" y1="112" x2="175" y2="112" stroke="#30363d" stroke-width="1"/>
    
    <text x="105" y="135" fill="#7ee787" font-size="11" font-family="monospace" text-anchor="middle">Quaternion (||q||=1)</text>
    <text x="105" y="156" fill="#7ee787" font-size="11" font-family="monospace" text-anchor="middle">Euler Angles (rad)</text>
    <text x="105" y="184" fill="#79c0ff" font-size="10" font-family="monospace" text-anchor="middle">FilterStatus</text>
  </g>

  <!-- ==================== CONEXIONES EXTERNAS ==================== -->

  <!-- Entrada: SensorModel -> Facade (Y=175) -->
  <path d="M 250 175 L 380 175" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-data)"/>
  <rect x="270" y="158" width="90" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="315" y="172" fill="#7ee787" font-size="9" font-family="monospace" text-anchor="middle">ImuSample</text>

  <!-- Salida: Facade -> Telemetry (Y=175) -->
  <path d="M 740 175 L 890 175" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-data)"/>
  <rect x="765" y="158" width="95" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="812" y="172" fill="#7ee787" font-size="9" font-family="monospace" text-anchor="middle">State / Status</text>

  <!-- ==================== LEYENDA ==================== -->
  <g transform="translate(370, 505)">
    <line x1="0" y1="10" x2="35" y2="10" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
    <text x="45" y="13" fill="#c9d1d9" font-size="10">Control Invocation</text>

    <line x1="180" y1="10" x2="215" y2="10" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-data)"/>
    <text x="225" y="13" fill="#c9d1d9" font-size="10">Data Interface</text>

    <line x1="330" y1="10" x2="365" y2="10" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)"/>
    <text x="375" y="13" fill="#c9d1d9" font-size="10">Auxiliary Call</text>
  </g>
</svg>
